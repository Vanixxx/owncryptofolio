# Every push and pull request: backend tests against a real PostgreSQL, lint, frontend
# tests and build, and a trial build of the image (not pushed).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/owncryptofolio_test
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7
      # backups call pg_dump/pg_restore of the server's major version
      - name: PostgreSQL 18 client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Test database
        run: PGPASSWORD=ci psql -h localhost -U postgres -c "CREATE DATABASE owncryptofolio_test"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Dockerfile
          push: false
          load: true
          tags: owncryptofolio:ci
          build-args: APP_VERSION=0.0.0-ci
      # a first start as a new user has it: folders Docker creates as root, Unraid's 99:100
      - name: Start test
        run: |
          docker network create ocf
          docker run -d --name db --network ocf -e POSTGRES_PASSWORD=ci postgres:18
          docker run -d --name app --network ocf -p 8080:8080 \
            -e DB_HOST=db -e DB_USER=postgres -e DB_PASSWORD=ci -e PUID=99 -e PGID=100 \
            -v "$RUNNER_TEMP/fresh/data:/data" -v "$RUNNER_TEMP/fresh/backups:/backups" owncryptofolio:ci
          for i in $(seq 60); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 3
          done
          docker logs app 2>&1 | tail -30
          curl -fsS http://127.0.0.1:8080/api/health
          docker exec app sh -c 'ps -o user= -p 1 2>/dev/null || stat -c %u /proc/1'
          test "$(stat -c %u:%g "$RUNNER_TEMP/fresh/data/secrets/keys.json")" = "99:100"
          test "$(docker exec app stat -c %u /proc/1)" = "99"
