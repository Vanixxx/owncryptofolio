# A tag v1.2.3.4 builds the image for amd64 and arm64, pushes it to
# ghcr.io/vanixxx/owncryptofolio (:1.2.3.4 and :latest) and opens a GitHub release with
# that version's section of the changelog.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
      - name: Release notes from the changelog
        run: |
          awk -v v="## ${GITHUB_REF_NAME} " 'index($0, v) == 1 {on = 1; next} /^## v/ {on = 0} on' \
            CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Image: \`${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}\`" >> notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
