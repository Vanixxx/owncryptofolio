[project]
name = "owncryptofolio"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Self-hosted crypto portfolio tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "ccxt>=4.4",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
    "fpdf2>=2.8.9",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "python-dotenv>=1.2.4",
    "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Depends()/Body() as defaults is the FastAPI idiom

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder is not our package

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "W291"]
"tests/*" = ["E501"]  # test data reads better as one row per line
