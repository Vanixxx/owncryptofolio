[plugin]
name = "Mantle"
author = "owncryptofolio"
version = "1.0.0"
description = "Reads MNT, tokens and internal MNT transfers of an address through Etherscan V2 (free key)."
status = "beta"

[source]
provider = "mantle"
provider_name = "Mantle"
kind = "wallet"
channel = "chain"
provides_balance = true
provides_id = true
not_read = ["NFT transfers (ERC-721/1155)"]

[chain]
native_asset = "MNT"
decimals = 18
address_pattern = "^0x[0-9a-fA-F]{40}$"
explorer = "https://api.etherscan.io/v2/api"
family = "evm"
service = "etherscan"
