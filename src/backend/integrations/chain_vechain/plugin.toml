[plugin]
name = "VeChain"
author = "owncryptofolio"
version = "1.0.0"
description = "Reads VET and VTHO transfers of an address from a public VeChainThor node (free, no key)."
status = "tested"

[source]
provider = "vechain"
provider_name = "VeChain"
kind = "wallet"
channel = "chain"
provides_balance = true
provides_id = true
not_read = ["Other VIP-180 tokens"]

[chain]
native_asset = "VET"
decimals = 18
address_pattern = "^0x[0-9a-fA-F]{40}$"
explorer = "https://mainnet.vechain.org"
# VTHO generated by holding VET is no transfer: the app books it from the balance
accrues = ["VTHO"]
