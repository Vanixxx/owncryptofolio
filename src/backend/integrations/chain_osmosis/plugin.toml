[plugin]
name = "Osmosis"
author = "owncryptofolio"
version = "1.0.0"
description = "Reads OSMO transfers, IBC coins and staking rewards of an address through public REST nodes (free, no key)."
status = "beta"

[source]
provider = "osmosis"
provider_name = "Osmosis"
kind = "wallet"
channel = "chain"
provides_balance = true
provides_id = true
not_read = ["History older than the public nodes keep (usually a few months): the balance check shows the gap", "Pending (unclaimed) staking rewards", "Slashing", "Tokens other than the chain's coin and IBC coins (factory, CW20)"]

[chain]
native_asset = "OSMO"
decimals = 6
address_pattern = "^osmo1[02-9ac-hj-np-z]{38}$"
explorer = "https://rest.cosmos.directory/osmosis"
