[plugin]
name = "Sonic"
author = "owncryptofolio"
version = "1.0.0"
description = "Reads S, tokens and internal S transfers of an address through Etherscan V2 (free key)."
status = "tested"

[source]
provider = "sonic"
provider_name = "Sonic"
kind = "wallet"
channel = "chain"
provides_balance = true
provides_id = true
not_read = ["NFT transfers (ERC-721/1155)"]

[chain]
native_asset = "S"
decimals = 18
address_pattern = "^0x[0-9a-fA-F]{40}$"
explorer = "https://api.etherscan.io/v2/api"
family = "evm"
service = "etherscan"
