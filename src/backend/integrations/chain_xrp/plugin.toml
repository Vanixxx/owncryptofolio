[plugin]
name = "XRP Ledger"
author = "owncryptofolio"
version = "1.0.0"
description = "Reads XRP and issued-currency payments of an account through Ripple's public servers (free, no key)."
status = "beta"

[source]
provider = "xrp"
provider_name = "XRP Ledger"
kind = "wallet"
channel = "chain"
provides_balance = true
provides_id = true
not_read = ["DEX trades (offers, AMM)", "Escrow and payment channels", "NFTs"]

[chain]
native_asset = "XRP"
decimals = 6
address_pattern = "^r[1-9A-HJ-NP-Za-km-z]{24,34}$"
explorer = "https://s2.ripple.com:51234"
