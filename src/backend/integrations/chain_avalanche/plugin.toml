[plugin]
name = "Avalanche C-Chain"
author = "owncryptofolio"
version = "1.0.0"
description = "Reads AVAX, tokens and internal AVAX transfers of an address through Routescan (free, no key)."
status = "tested"

[source]
provider = "avalanche"
provider_name = "Avalanche C-Chain"
kind = "wallet"
channel = "chain"
provides_balance = true
provides_id = true
not_read = ["NFT transfers (ERC-721/1155)"]

[chain]
native_asset = "AVAX"
decimals = 18
address_pattern = "^0x[0-9a-fA-F]{40}$"
explorer = "https://api.routescan.io/v2/network/mainnet/evm/43114/etherscan/api"
family = "evm"
