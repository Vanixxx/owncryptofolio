[plugin]
name = "Ethereum"
author = "owncryptofolio"
version = "1.0.0"
description = "Reads ETH, ERC-20 tokens and internal ETH transfers of an address through Blockscout (free, no key)."
status = "tested"

[source]
provider = "ethereum"
provider_name = "Ethereum"
kind = "wallet"
channel = "chain"
provides_balance = true
provides_id = true
not_read = ["NFT transfers (ERC-721/1155)"]

[chain]
native_asset = "ETH"
decimals = 18
address_pattern = "^0x[0-9a-fA-F]{40}$"
explorer = "https://eth.blockscout.com/api"
family = "evm"
