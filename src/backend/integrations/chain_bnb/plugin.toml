[plugin]
name = "BNB Smart Chain"
author = "owncryptofolio"
version = "1.0.0"
description = "Reads BNB, BEP-20 tokens and internal BNB transfers of an address through NodeReal MegaNode (BSCTrace, free key)."
status = "tested"

[source]
provider = "bnb"
provider_name = "BNB Smart Chain"
kind = "wallet"
channel = "chain"
provides_balance = true
provides_id = true
not_read = ["NFT transfers (BEP-721/1155)"]

[chain]
native_asset = "BNB"
decimals = 18
address_pattern = "^0x[0-9a-fA-F]{40}$"
explorer = "https://bsc-mainnet.nodereal.io/v1"
family = "evm"
service = "nodereal"
