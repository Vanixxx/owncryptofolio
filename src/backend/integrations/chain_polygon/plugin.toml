[plugin]
name = "Polygon"
author = "owncryptofolio"
version = "1.1.0"
description = "Reads POL, tokens and internal POL transfers of an address through Etherscan V2 (free key)."
status = "tested"

[source]
provider = "polygon"
provider_name = "Polygon"
kind = "wallet"
channel = "chain"
provides_balance = true
provides_id = true
not_read = ["NFT transfers (ERC-721/1155)"]

[chain]
native_asset = "POL"
decimals = 18
address_pattern = "^0x[0-9a-fA-F]{40}$"
explorer = "https://api.etherscan.io/v2/api"
family = "evm"
service = "etherscan"
