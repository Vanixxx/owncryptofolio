[plugin]
name = "Cronos"
author = "owncryptofolio"
version = "1.0.0"
description = "Reads CRO transfers of an address through the Cronos Explorer API (free key)."
status = "tested"

[source]
provider = "cronos"
provider_name = "Cronos EVM"
kind = "wallet"
channel = "chain"
provides_balance = true
provides_id = true
not_read = ["Token transfers (CRC-20)", "Internal CRO transfers", "NFT transfers"]

[chain]
native_asset = "CRO"
decimals = 18
address_pattern = "^0x[0-9a-fA-F]{40}$"
explorer = "https://explorer-api.cronos.org/mainnet/api/v1"
family = "evm"
service = "cronos"
