[plugin]
name = "Ronin"
author = "owncryptofolio"
version = "1.0.0"
description = "Reads RON, tokens and internal RON transfers of an address through Ronin's Blockscout explorer (free, no key)."
status = "tested"

[source]
provider = "ronin"
provider_name = "Ronin"
kind = "wallet"
channel = "chain"
provides_balance = true
provides_id = true
not_read = ["NFT transfers (ERC-721/1155), e.g. Axies and land"]

[chain]
native_asset = "RON"
decimals = 18
address_pattern = "^(0x|ronin:)[0-9a-fA-F]{40}$"
explorer = "https://explorer.roninchain.com/api"
family = "evm"
