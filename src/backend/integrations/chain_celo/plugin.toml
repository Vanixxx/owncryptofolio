[plugin]
name = "Celo"
author = "owncryptofolio"
version = "1.0.0"
description = "Reads CELO, tokens and internal CELO transfers of an address through Blockscout (no key)."
status = "beta"

[source]
provider = "celo"
provider_name = "Celo"
kind = "wallet"
channel = "chain"
provides_balance = true
provides_id = true
not_read = ["NFT transfers (ERC-721/1155)"]

[chain]
native_asset = "CELO"
decimals = 18
address_pattern = "^0x[0-9a-fA-F]{40}$"
explorer = "https://celo.blockscout.com/api"
family = "evm"
